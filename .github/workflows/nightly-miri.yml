name: hypg-miri

# UB interpreted-execution over the arithmetic cores. The rank-4 KEM
# took ~3.7 h under Miri in the latest local record, so this runs weekly
# + on demand — never per-push. DS is excluded with rationale:
# hypertree signing under Miri is hours-long; DS shares the
# core/symm/KEM primitives and its own logic is covered by S10/S11/S12
# redteam sweeps. See docs/testplan.md for the exact recorded subset.

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: miri (core, fast)
        run: cargo +nightly miri test -p hypg-core --lib --locked
      - name: miri (symm, fast)
        run: cargo +nightly miri test -p hypg-symm --lib --locked
      - name: miri (kem, slow ~75 min)
        run: cargo +nightly miri test -p hypg-kem --lib --locked
