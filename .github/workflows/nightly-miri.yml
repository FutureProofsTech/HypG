name: hypg-miri

# UB interpreted-execution over the arithmetic cores. KEM takes ~75 min
# locally under Miri (interpreter), so this runs weekly + on demand —
# never per-push. DS is excluded with rationale: hypertree signing
# under Miri is hours-long; DS shares the Miri-clean core/symm/KEM
# primitives and its own logic is covered by S10/S11/S12 redteam sweeps.

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: miri (symm, fast)
        run: cargo +nightly miri test -p hypg-symm --lib --locked
      - name: miri (kem, slow ~75 min)
        run: cargo +nightly miri test -p hypg-kem --lib --locked
